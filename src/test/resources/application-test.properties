spring.datasource.url=jdbc:h2:mem:weatherdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

openweather.api-key=test-api-key
openweather.weather-base-url=http://localhost:9999/data/2.5
openweather.geocoding-base-url=http://localhost:9999/geo/1.0
openweather.connect-timeout=1s
openweather.read-timeout=1s

spring.cache.type=caffeine
spring.cache.cache-names=weather
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=10m

jwt.secret=VGhpc0lzQVN1ZmZpY2llbnRseUxvbmdTZWNyZXRGb3JUZXN0aW5n
jwt.access-token-expiration=900000
jwt.refresh-token-expiration=604800000
